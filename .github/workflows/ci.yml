name: CI

# PR tier is deliberately light: fmt + clippy + unit tests (one job), plus UI/SDK
# checks only when those trees change. Heavy suites (Kafka, Postgres/storage
# conformance, e2e, consumer gate, cargo-deny/machete, installer) live in
# heavy.yml and run on release tags, weekly, manual dispatch, or when a PR has
# the `ci:full` label.
#
# Merge gate for heavy-suite code: the `evidence-gate` job. Run
# `scripts/verify-full.sh` locally and commit .ci/evidence/full-suite.json
# (hash of all tracked files), or label the PR `ci:full`.
#
# Branch protection: required checks are now "Rust (fmt, clippy, test)",
# "Frontend (SDK + UI)" and "evidence-gate" (old names Check/Test/Clippy/Format/
# SDK/UI/Deny/Machete/... no longer exist). Docs-only PRs skip this workflow
# entirely (paths-ignore), so do not mark these as required without that in mind.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
      - 'LICENSE*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sdk: ${{ steps.f.outputs.sdk }}
      ui: ${{ steps.f.outputs.ui }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            sdk:
              - 'sdk/typescript/**'
            ui:
              - 'ui/**'

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AXON_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      # clippy subsumes `cargo check`
      - run: cargo clippy --workspace --no-deps -- -D warnings -D clippy::todo -D clippy::unimplemented -D clippy::dbg_macro -D clippy::print_stdout -D clippy::unwrap_used
      - run: cargo test
      - run: python3 scripts/check_covers_traceability_test.py
      - run: python3 scripts/check_covers_traceability.py --format text

  frontend:
    name: Frontend (SDK + UI)
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.sdk == 'true'
        with:
          node-version: '22'
      - name: SDK
        if: needs.changes.outputs.sdk == 'true'
        run: |
          cd sdk/typescript
          npm install
          npm test -- --run
          npm run lint
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.ui == 'true'
      - name: UI
        if: needs.changes.outputs.ui == 'true'
        run: |
          cd ui
          bun install
          bun run typecheck
          bun run lint
          bun test src/
          bun run build
          bun run check:story-coverage

  full:
    name: Heavy suite (ci:full)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')
    uses: ./.github/workflows/heavy.yml

  # Cheap gate (seconds): proves the heavy suite was run for this exact tree.
  # Passes if (a) .ci/evidence/full-suite.json matches the PR head content hash
  # (produced by scripts/verify-full.sh), OR (b) PR has label `ci:full` and the
  # heavy job passed, OR (c) the diff touches no path the heavy suite covers.
  evidence-gate:
    name: evidence-gate
    if: always() && github.event_name == 'pull_request'
    needs: [full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check evidence
        env:
          FULL_RESULT: ${{ needs.full.result }}
          BASE_REF: ${{ github.base_ref }}
          HEAVY_RE: '^(crates/|Cargo\.|deny\.toml|ui/|scripts/|sdk/|Dockerfile|docker|rust-toolchain)'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Ev '^(scripts/verify-full\.sh|\.ci/evidence/)' || true)
          if ! grep -Eq "$HEAVY_RE" <<<"$changed"; then
            echo "No heavy-suite paths changed; gate passes."; exit 0
          fi
          if [[ "$FULL_RESULT" == "success" ]]; then
            echo "ci:full label set and heavy suite passed; gate passes."; exit 0
          fi
          f=.ci/evidence/full-suite.json
          if [[ -f "$f" ]]; then
            want=$(jq -r .content_hash "$f")
            have=$(bash scripts/verify-full.sh --hash-only)
            if [[ "$want" == "$have" ]]; then
              echo "Evidence matches ($(jq -r '.suite + " @ " + .timestamp' "$f")); gate passes."; exit 0
            fi
            echo "::error::Evidence is stale (recorded $want, tree is $have). Re-run scripts/verify-full.sh and commit."
          else
            echo "::error::No $f. Run scripts/verify-full.sh and commit the evidence, or add the 'ci:full' label."
          fi
          exit 1
